[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medusa-automation-framework"
version = "0.1.0"
description = "Playwright + pytest automation framework for Medusa.js applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.49.0",
  "pytest>=8.3.0",
  "pytest-playwright>=0.6.2",
  "python-dotenv>=1.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "smoke: quick checks against the Medusa app",
  "e2e: live browser tests that require a running application",
]
