name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install project dependencies
        run: uv sync

      - name: Install report generator
        run: npm ci

      - name: Install Playwright browsers on Linux
        if: runner.os == 'Linux'
        run: uv run playwright install --with-deps chromium

      - name: Install Playwright browsers on Windows
        if: runner.os == 'Windows'
        run: uv run playwright install chromium

      - name: Validate framework syntax
        run: uv run python -m compileall src tests

      - name: Detect tests
        id: test-discovery
        shell: pwsh
        run: |
          uv run pytest --collect-only -q
          $collectionExitCode = $LASTEXITCODE

          if ($collectionExitCode -eq 5) {
            "has-tests=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Output "No finalized tests are present; report generation is skipped."
            exit 0
          }

          if ($collectionExitCode -ne 0) {
            exit $collectionExitCode
          }

          "has-tests=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Run tests
        if: steps.test-discovery.outputs.has-tests == 'true'
        run: uv run pytest

      - name: Generate Allure report
        if: always() && steps.test-discovery.outputs.has-tests == 'true'
        run: npm run report:generate

      - name: Upload test report and evidence
        if: always() && steps.test-discovery.outputs.has-tests == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ runner.os }}-py${{ matrix.python-version }}
          path: |
            allure-report/index.html
            allure-results/
            test-results/
          if-no-files-found: warn
          retention-days: 14
